<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Ôn Tập Đa Môn - Sinh Học 11 & Địa Lý 11 (70 Câu)</title>
  <style>
    :root {
      --primary: #db2777;        /* Hồng đậm chủ đạo */
      --primary-dark: #be185d;   /* Hồng trầm khi hover */
      --primary-light: #fce7f3;  /* Hồng phấn nhạt */
      --primary-soft: #fdf2f8;   /* Nền trắng ánh hồng nhẹ */
      --accent: #ec4899;         /* Hồng tươi điểm nhấn */
      --bg: #fff5f9;             /* Nền trang trắng hồng pastel */
      --card: #ffffff;           /* Nền thẻ trắng tinh */
      --text: #331826;           /* Chữ tím hồng than dễ đọc */
      --muted: #83586d;
      --correct: #10b981;
      --correct-bg: #d1fae5;
      --wrong: #f43f5e;
      --wrong-bg: #ffe4e6;
      --border: #f9a8d4;         /* Viền hồng pastel */
      --border-soft: #fbcfe8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }

    /* Header trắng - hồng */
    header {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: #ffffff; padding: 16px 20px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.22);
    }
    .header-inner {
      max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: center; gap: 12px;
    }
    h1 { font-size: 1.22rem; font-weight: 700; letter-spacing: 0.2px; }
    .stats { display: flex; gap: 8px; font-size: 0.9rem; flex-wrap: wrap; }
    .badge {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 5px 12px; border-radius: 999px; font-weight: 600;
      backdrop-filter: blur(4px);
    }

    /* Thanh chọn môn học */
    .subject-bar {
      background: #ffffff; padding: 12px 20px; text-align: center;
      border-bottom: 2px solid var(--border-soft);
      box-shadow: 0 2px 8px rgba(236, 72, 153, 0.06);
    }
    .sub-select-btn {
      padding: 8px 20px; border-radius: 999px; border: 2px solid var(--border);
      background: #ffffff; color: var(--primary); font-weight: 700; cursor: pointer;
      margin: 0 6px; transition: all 0.2s ease; font-size: 0.95rem;
    }
    .sub-select-btn:hover { background: var(--primary-soft); transform: translateY(-1px); }
    .sub-select-btn.active {
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: #ffffff; border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(219, 39, 119, 0.28);
    }

    /* Thanh công cụ */
    .toolbar {
      max-width: 980px; margin: 16px auto; padding: 0 16px;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
    }
    .btn {
      padding: 9px 15px; border: none; border-radius: 10px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem; transition: all 0.15s ease;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
      box-shadow: 0 2px 6px rgba(236, 72, 153, 0.3);
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline {
      background: #ffffff; color: var(--primary);
      border: 1.5px solid var(--border);
    }
    .btn-outline:hover { background: var(--primary-light); }
    .btn-outline.active {
      background: var(--primary); color: #ffffff; border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.25);
    }
    .btn-danger { background: #f43f5e; color: #fff; }
    .btn-danger:hover { background: #e11d48; }
    .btn-success { background: var(--correct); color: #fff; }
    .btn-success:hover { background: #059669; }

    .container { max-width: 980px; margin: 0 auto; padding: 0 16px; }

    /* Bảng số thứ tự 70 câu */
    .q-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 6px; background: #ffffff; padding: 14px; border-radius: 14px;
      border: 1.5px solid var(--border-soft); margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(236, 72, 153, 0.06);
    }
    .q-dot {
      height: 34px; border-radius: 8px; border: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.84rem; font-weight: 600; cursor: pointer;
      background: var(--primary-soft); color: var(--primary); transition: 0.15s;
    }
    .q-dot:hover { background: var(--primary-light); border-color: var(--accent); }
    .q-dot.done-ok { background: var(--correct-bg); color: #065f46; border-color: var(--correct); }
    .q-dot.done-err { background: var(--wrong-bg); color: #9f1239; border-color: var(--wrong); }
    .q-dot.done-wait { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    /* Thẻ câu hỏi */
    .card {
      background: var(--card); border-radius: 14px; padding: 18px 20px;
      margin-bottom: 14px; border: 1.5px solid var(--border-soft);
      box-shadow: 0 3px 10px rgba(236, 72, 153, 0.05);
    }
    .q-title { font-weight: 700; font-size: 1.04rem; margin-bottom: 12px; line-height: 1.48; white-space: pre-line; }
    .q-num {
      color: #ffffff; background: var(--accent); padding: 2px 9px;
      border-radius: 999px; margin-right: 8px; font-size: 0.9rem; display: inline-block;
    }
    .options { display: grid; gap: 8px; }
    .opt-btn {
      text-align: left; padding: 11px 14px; border-radius: 10px;
      border: 1.5px solid var(--border-soft); background: var(--primary-soft);
      cursor: pointer; font-size: 0.96rem; transition: 0.14s; line-height: 1.42; color: var(--text);
    }
    .opt-btn:hover { background: var(--primary-light); border-color: var(--accent); }
    .opt-btn.selected { border-color: var(--primary); background: var(--primary-light); font-weight: 700; color: var(--primary-dark); }
    .opt-btn.correct { border-color: var(--correct); background: var(--correct-bg); color: #065f46; font-weight: 700; }
    .opt-btn.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: #9f1239; text-decoration: line-through; }

    .sub-table {
      width: 100%; border-collapse: collapse; margin: 10px 0 14px; font-size: 0.93rem;
      border-radius: 8px; overflow: hidden;
    }
    .sub-table th, .sub-table td {
      border: 1px solid var(--border-soft); padding: 9px 11px; text-align: left;
    }
    .sub-table th { background: var(--primary-light); color: var(--primary-dark); text-align: center; }

    .tf-btn {
      padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--border);
      cursor: pointer; font-weight: 600; background: #fff; color: var(--primary);
    }
    .tf-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tf-btn.correct { background: var(--correct); color: #fff; border-color: var(--correct); }
    .tf-btn.wrong { background: var(--wrong); color: #fff; border-color: var(--wrong); }

    .explain {
      margin-top: 10px; padding: 10px 13px; border-radius: 10px;
      background: var(--primary-soft); border-left: 4px solid var(--primary);
      font-size: 0.91rem; display: none; color: var(--text);
    }
    .explain.show { display: block; }

    /* Khu vực Tự luận tương tác */
    .essay-card {
      background: #ffffff; border-radius: 16px; padding: 22px;
      margin-bottom: 18px; border: 2px solid var(--border-soft);
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.08);
    }
    .essay-header {
      font-size: 1.1rem; font-weight: 700; color: var(--primary-dark);
      margin-bottom: 8px; line-height: 1.45;
    }
    .essay-prompt {
      background: var(--primary-soft); border: 1px dashed var(--border);
      padding: 12px 14px; border-radius: 10px; margin-bottom: 12px;
      font-size: 0.95rem; line-height: 1.55;
    }
    .essay-textarea {
      width: 100%; min-height: 150px; padding: 13px 15px;
      border-radius: 12px; border: 2px solid var(--border);
      background: #fffafa; color: var(--text); font-size: 0.96rem;
      line-height: 1.55; resize: vertical; outline: none; transition: 0.2s;
    }
    .essay-textarea:focus {
      border-color: var(--primary); background: #ffffff;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.18);
    }
    .essay-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center;
    }
    .essay-feedback {
      margin-top: 12px; padding: 12px 15px; border-radius: 10px;
      background: var(--primary-soft); border-left: 4px solid var(--accent);
      font-size: 0.93rem; line-height: 1.55; display: none;
    }
    .essay-feedback.show { display: block; }
    .essay-sample {
      margin-top: 12px; padding: 14px 16px; border-radius: 12px;
      background: #fdf2f8; border: 1.5px solid var(--border);
      font-size: 0.94rem; line-height: 1.65; display: none;
    }
    .essay-sample.show { display: block; }
    .essay-sample ul { padding-left: 20px; margin-top: 6px; }
    .kw-tag {
      display: inline-block; padding: 3px 9px; border-radius: 999px;
      font-size: 0.82rem; font-weight: 600; margin: 3px 4px 3px 0;
    }
    .kw-ok { background: var(--correct-bg); color: #065f46; border: 1px solid var(--correct); }
    .kw-miss { background: var(--wrong-bg); color: #9f1239; border: 1px solid var(--wrong); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1 id="header-title">🌸 Ôn Tập Sinh Học 11 (70 Câu Trắc Nghiệm & Tự Luận)</h1>
    <div class="stats">
      <span class="badge" id="stat-done">Đã làm: 0/70</span>
      <span class="badge" id="stat-correct">Đúng: 0</span>
      <span class="badge" id="stat-score">Điểm: 0.00</span>
    </div>
  </div>
</header>

<!-- THANH CHỌN MÔN HỌC -->
<div class="subject-bar">
  <button class="sub-select-btn active" id="btn-sub-bio" onclick="switchSubject('bio')">🧬 Sinh Học 11 (70 câu + Tự luận)</button>
  <button class="sub-select-btn" id="btn-sub-geo" onclick="switchSubject('geo')">🌍 Địa Lý 11 (70 câu + Tự luận)</button>
</div>

<div class="toolbar">
  <div style="display:flex; gap:6px; flex-wrap:wrap;">
    <button class="btn btn-outline active" id="mode-instant" onclick="setMode('instant')">⚡ Luyện tập (Biết ngay)</button>
    <button class="btn btn-outline" id="mode-exam" onclick="setMode('exam')">📝 Thi thử (Nộp bài mới chấm)</button>
    <button class="btn btn-outline" id="tab-essay" onclick="toggleEssay()">✍️ Làm Tự luận (Có ô điền đáp án)</button>
  </div>
  <div style="display:flex; gap:6px; flex-wrap:wrap;" id="quiz-controls">
    <button class="btn btn-primary" onclick="shuffleQuestions()">🔀 Đảo câu hỏi</button>
    <button class="btn btn-success" id="btn-submit" style="display:none;" onclick="submitExam()">✅ Nộp bài chấm điểm</button>
    <button class="btn btn-outline" onclick="filterWrong()">🎯 Làm lại câu sai</button>
    <button class="btn btn-danger" onclick="resetQuiz()">🔄 Làm lại từ đầu</button>
  </div>
</div>

<div class="container">
  <div class="q-grid" id="nav-grid"></div>
  <div id="quiz-area"></div>
  <div id="essay-area" style="display:none;"></div>
</div>

<script>
// ==================== 1. DỮ LIỆU 70 CÂU SINH HỌC 11 ====================
const BIO_QUESTIONS = [
  {id:1, q:"Rễ cây hấp thụ những chất nào?", opts:["A. Nước cùng các ion khoáng.","B. Nước cùng các chất dinh dưỡng.","C. Nước và các chất khí.","D. O₂ và các chất dinh dưỡng hòa tan trong nước."], ans:0},
  {id:2, q:"Bộ phận hút nước chủ yếu của cây ở trên cạn là", opts:["A. lá, thân, rễ.","B. lá, thân.","C. rễ, thân.","D. Rễ."], ans:3},
  {id:3, q:"Nước và ion khoáng được hấp thụ vào mạch gỗ của rễ qua con đường nào?", opts:["A. Con đường qua thành tế bào - không bào.","B. Con đường qua chất nguyên sinh – gian bào.","C. Con đường qua không bào – gian bào.","D. Con đường qua chất nguyên sinh – không bào."], ans:1, note:"Gồm 2 con đường: gian bào và tế bào chất (chất nguyên sinh)."},
  {id:4, q:"Đơn vị hút nước của rễ là:", opts:["A. tế bào rễ.","B. tế bào biểu bì.","C. tế bào nội bì.","D. tế bào lông hút."], ans:3},
  {id:5, q:"Nước xâm nhập vào tế bào lông hút theo cơ chế", opts:["A. thẩm thấu.","B. thẩm tách.","C. chủ động.","D. nhập bào."], ans:0},
  {id:6, q:"Nước không có vai trò nào sau đây?", opts:["A. Làm dung môi hòa tan các chất.","B. Đảm bảo hình dạng của tế bào.","C. Đảm bảo sự thụ tinh kép xảy ra.","D. Ảnh hưởng đến sự phân bố của thực vật."], ans:2},
  {id:7, q:"Phát biểu đúng về mối quan hệ giữa trao đổi chất trong tế bào với trao đổi chất của cơ thể:", opts:["A. Chuyển hóa vật chất và năng lượng trong tế bào là cơ sở cho sự trao đổi chất giữa cơ thể với môi trường.","B. Chuyển hóa vật chất và năng lượng trong tế bào không liên quan đến sự trao đổi chất giữa cơ thể với môi trường.","C. Sự trao đổi chất giữa cơ thể với môi trường là cơ sở cho chuyển hóa vật chất và năng lượng trong tế bào.","D. Chỉ có trao đổi chất giữa cơ thể với môi trường là quyết định sự tồn tại của sinh vật."], ans:0},
  {id:8, q:"Các ion khoáng được hấp thụ vào rễ theo cơ chế nào?", opts:["A. Thụ động.","B. Chủ động.","C. Thụ động và chủ động.","D. Thẩm tách."], ans:2},
  {id:9, q:"Động lực nào đẩy dòng mạch rây từ lá đến rễ và các cơ quan khác", opts:["A. Trọng lực của trái đất.","B. Áp suất của lá.","C. Sự chênh lệch áp suất thẩm thấu giữa cơ quan rễ với môi trường đất.","D. Sự chênh lệch áp suất thẩm thấu giữa cơ quan nguồn và cơ quan chứa."], ans:3},
  {id:10, q:"Dòng mạch gỗ được vận chuyển nhờ:\n1. Lực đẩy (áp suất rễ)\n2. Lực hút do thoát hơi nước ở lá\n3. Lực liên kết giữa các phân tử nước với nhau và với thành mạch gỗ\n4. Sự chênh lệch áp suất thẩm thấu giữa cơ quan nguồn (lá) và cơ quan chứa (quả, củ…)\n5. Sự chênh lệch áp suất thẩm thấu giữa môi trường rễ và môi trường đất", opts:["A. 1-3-5","B. 1-2-4","C. 1-2-3","D. 1-3-4"], ans:2},
  {id:11, q:"Dòng mạch rây vận chuyển sản phẩm đồng hóa ở lá chủ yếu là", opts:["A. nước.","B. ion khoáng.","C. nước và ion khoáng.","D. Saccarôza và axit amin."], ans:3},
  {id:12, q:"Áp suất rễ được thể hiện qua hiện tượng:", opts:["A. rỉ nhựa.","B. ứ giọt.","C. rỉ nhựa và ứ giọt.","D. thoát hơi nước."], ans:2},
  {id:13, q:"Quá trình thoát hơi nước qua lá không có vai trò", opts:["A. vận chuyển nước, ion khoáng.","B. cung cấp CO₂ cho quá trình quang hợp.","C. hạ nhiệt độ cho lá.","D. cung cấp năng lượng cho lá."], ans:3},
  {id:14, q:"Sinh vật tự dưỡng là sinh vật có khả năng", opts:["A. tự tổng hợp chất hữu cơ từ các chất vô cơ.","B. phân giải xác sinh vật khác để lấy chất hữu cơ.","C. tự tổng hợp chất hữu cơ từ các chất hữu cơ có sẵn.","D. tự tổng hợp các chất vô cơ từ các chất vô cơ có sẵn."], ans:0},
  {id:15, q:"Các dấu hiệu đặc trưng của trao đổi chất và chuyển hóa năng lượng ở sinh vật là?", opts:["A. Tiếp nhận các chất từ môi trường và vận chuyển các chất → Biến đổi các chất kèm theo chuyển hóa năng lượng ở cơ thể → Thải các chất vào môi trường → Điều hòa","B. Tiếp nhận các chất từ môi trường và vận chuyển các chất → Biến đổi các chất kèm theo chuyển hóa năng lượng ở tế bào → Thải các chất vào môi trường → Điều hòa","C. Tiếp nhận các chất từ con người và vận chuyển các chất → Biến đổi các chất kèm theo chuyển hóa năng lượng ở tế bào → Thải các chất vào môi trường → Điều hòa","D. Tiếp nhận các chất từ môi trường và vận chuyển các chất → Biến đổi các chất kèm theo chuyển hóa năng lượng ở tế bào → Giữ lại tất cả các chất → Điều hòa"], ans:1},
  {id:16, q:"“Ở thực vật, năng lượng từ ánh sáng được tích luỹ trong các chất hữu cơ tổng hợp từ quang hợp, sau đó các chất hữu cơ được phân giải trong quá trình hô hấp để giải phóng năng lượng cung cấp cho các hoạt động sống” là dấu hiệu đặc trưng nào của quá trình trao đổi chất và chuyển hoá năng lượng?", opts:["A. Thu nhận & vận chuyển các chất.","B. Bài tiết các chất thải vào môi trường.","C. Biến đổi vật chất & chuyển hóa năng lượng.","D. Điều hòa quá trình trao đổi chất."], ans:2},
  {id:17, q:"Sinh vật có thể tồn tại, sinh trưởng, phát triển và thích nghi với môi trường sống nhờ có sự", opts:["A. chuyển hóa năng lượng và sinh sản.","B. Chuyển hóa năng lượng và cảm ứng.","C. Trao đổi chất và chuyển hóa năng lượng.","D. Trao đổi chất và cảm ứng."], ans:2},
  {id:18, q:"Tất cả các cơ thể sống đều thường xuyên phải trao đổi chất và năng lượng với môi trường gọi là", opts:["A. hệ thống mở.","B. khả năng tự điều chỉnh.","C. sự liên tục tiến hóa.","D. tính thứ bậc."], ans:0},
  {id:19, q:"Thoát hơi nước qua lá bằng con đường", opts:["A. qua khí khổng, mô giậu.","B. qua khí khổng, cutin.","C. qua cutin, biểu bì.","D. qua cutin, mô giậu."], ans:1},
  {id:20, q:"Tác nhân chủ yếu điều tiết độ mở khí khổng là", opts:["A. nhiệt độ.","B. ánh sáng.","C. hàm lượng nước.","D. ion khoáng."], ans:2},

  {id:3, q:"Chỉ số phát triển con người (HDI) được tính dựa trên các tiêu chí cơ bản nào?", opts:["A. Tuổi thọ trung bình, số năm đi học và thu nhập bình quân đầu người (GNI/người).","B. Tỉ lệ gia tăng dân số, mật độ dân số và tỉ lệ đô thị hóa.","C. Trình độ công nghệ, năng suất lao động và dự trữ ngoại tệ.","D. Tỉ lệ sinh, tỉ lệ tử và cơ cấu dân số theo tuổi."], ans:0},
  {id:4, q:"Biểu hiện rõ nét nhất của toàn cầu hóa kinh tế là:", opts:["A. Sự thu hẹp quy mô giao thương giữa các nước.","B. Thương mại thế giới phát triển mạnh, tốc độ tăng trưởng cao hơn tăng trưởng GDP.","C. Các công ty xuyên quốc gia giảm dần phạm vi hoạt động.","D. Các rào cản thuế quan ngày càng tăng lên."], ans:1},
  {id:5, q:"Tổ chức nào sau đây chi phối tới 95% hoạt động thương mại của thế giới?", opts:["A. Quỹ Tiền tệ Quốc tế (IMF).","B. Ngân hàng Thế giới (WB).","C. Tổ chức Thương mại Thế giới (WTO).","D. Diễn đàn Hợp tác Kinh tế châu Á - Thái Bình Dương (APEC)."], ans:2},
  {id:6, q:"Hệ quả tiêu cực lớn nhất của toàn cầu hóa kinh tế là:", opts:["A. Kìm hãm sự phát triển của khoa học - công nghệ.","B. Làm gia tăng nhanh chóng khoảng cách giàu nghèo giữa các quốc gia.","C. Hạn chế sự chuyển dịch vốn đầu tư quốc tế.","D. Giảm tốc độ tăng trưởng kinh tế toàn cầu."], ans:1},
  {id:7, q:"Nguyên nhân chủ yếu nhất dẫn đến sự biến đổi khí hậu toàn cầu hiện nay là:", opts:["A. Các vụ phun trào núi lửa tự nhiên.","B. Lượng khí thải nhà kính (đặc biệt là CO₂) tăng cao do sản xuất công nghiệp và sinh hoạt.","C. Sự dịch chuyển của các mảng kiến tạo.","D. Thay đổi chu kỳ bức xạ của Mặt Trời."], ans:1},
  {id:8, q:"Vấn đề an ninh phi truyền thống nào sau đây đang đe dọa trực tiếp đến không gian mạng toàn cầu?", opts:["A. An ninh lương thực.","B. An ninh năng lượng.","C. An ninh mạng (tội phạm công nghệ cao).","D. An ninh nguồn nước."], ans:2},
  {id:9, q:"Khu vực Mỹ Latinh tiếp giáp với hai đại dương lớn nào?", opts:["A. Thái Bình Dương và Ấn Độ Dương.","B. Thái Bình Dương và Đại Tây Dương.","C. Đại Tây Dương và Bắc Băng Dương.","D. Ấn Độ Dương và Bắc Băng Dương."], ans:1},
  {id:10, q:"Kênh đào Panama ở khu vực Mỹ Latinh nối liền hai đại dương nào?", opts:["A. Thái Bình Dương và Đại Tây Dương.","B. Đại Tây Dương và Ấn Độ Dương.","C. Thái Bình Dương và Bắc Băng Dương.","D. Địa Trung Hải và Biển Đỏ."], ans:0},
  {id:11, q:"Đới khí hậu chiếm diện tích lớn nhất ở khu vực Mỹ Latinh là:", opts:["A. Khí hậu ôn đới và hàn đới.","B. Khí hậu xích đạo và cận xích đạo, nhiệt đới.","C. Khí hậu cận nhiệt Địa Trung Hải.","D. Khí hậu hoang mạc khắc nghiệt."], ans:1},
  {id:12, q:"Rừng nhiệt đới ẩm lớn nhất thế giới nằm ở đồng bằng Amazon thuộc quốc gia nào là chủ yếu?", opts:["A. Ác-hen-ti-na.","B. Bra-xin.","C. Mê-hi-cô.","D. Chi-lê."], ans:1},
  {id:13, q:"Dãy núi trẻ cao và đồ sộ chạy dọc phía tây khu vực Nam Mỹ là:", opts:["A. Dãy Hi-ma-lay-a.","B. Dãy An-đét (Andes).","C. Dãy An-pơ (Alps).","D. Dãy U-ran."], ans:1},
  {id:14, q:"Đặc điểm nổi bật về đô thị hóa ở khu vực Mỹ Latinh là:", opts:["A. Tỉ lệ dân thành thị rất thấp (dưới 30%).","B. Tỉ lệ dân thành thị rất cao (khoảng 80%) nhưng mang tính tự phát.","C. Đô thị hóa gắn liền chặt chẽ với công nghiệp hóa hiện đại.","D. Không có các siêu đô thị trên 10 triệu dân."], ans:1},
  {id:15, q:"Nguyên nhân chính dẫn đến hiện tượng đô thị hóa tự phát ở Mỹ Latinh là:", opts:["A. Công nghiệp ở các đô thị phát triển quá nóng.","B. Cuộc cải cách ruộng đất không triệt để khiến nông dân mất đất phải kéo ra thành phố tìm việc.","C. Chính sách cưỡng bức di dân của chính phủ.","D. Khí hậu vùng nông thôn quá lạnh giá."], ans:1},
  {id:16, q:"Hai nền kinh tế có quy mô GDP lớn nhất khu vực Mỹ Latinh là:", opts:["A. Bra-xin và Mê-hi-cô.","B. Cu-ba và Chi-lê.","C. Pê-ru và Cô-lôm-bi-a.","D. Vê-nê-xu-ê-la và Ê-cu-a-đo."], ans:0},
  {id:17, q:"Liên minh châu Âu (EU) có trụ sở chính đặt tại thành phố nào?", opts:["A. Pa-ri (Pháp).","B. Béc-lin (Đức).","C. Brúc-xen (Bỉ).","D. Rô-ma (I-ta-li-a)."], ans:2},
  {id:18, q:"Tính đến sau sự kiện Brexit, Liên minh châu Âu (EU) có bao nhiêu quốc gia thành viên?", opts:["A. 25 quốc gia.","B. 27 quốc gia.","C. 28 quốc gia.","D. 30 quốc gia."], ans:1},
  {id:19, q:"Bốn mặt hàng và yếu tố được tự do lưu thông trong thị trường chung châu Âu (EU) là:", opts:["A. Hàng hóa, con người, dịch vụ, tiền vốn.","B. Vũ khí, tài nguyên, lao động, thuế quan.","C. Nông sản, dầu mỏ, vàng bạc, bất động sản.","D. Hàng hóa, biên giới, quân đội, tiền tệ."], ans:0},
  {id:20, q:"Việc đưa đồng tiền chung Ơ-rô (Euro) vào giao dịch trong EU KHÔNG mang lại lợi ích nào sau đây?", opts:["A. Xóa bỏ những rủi ro khi chuyển đổi tiền tệ.","B. Tạo thuận lợi cho việc chuyển giao vốn trong EU.","C. Đơn giản hóa công tác kế toán của các doanh nghiệp đa quốc gia.","D. Tăng thêm chi phí giao dịch ngoại hối giữa các nước thành viên."], ans:3},
  {id:21, q:"Quốc gia có quy mô kinh tế (GDP) lớn nhất trong Liên minh châu Âu (EU) là:", opts:["A. Pháp.","B. Cộng hòa Liên bang Đức.","C. I-ta-li-a.","D. Tây Ban Nha."], ans:1},

  {id:23, q:"Khu vực Đông Nam Á bao gồm hai bộ phận địa lí là:", opts:["A. Đông Nam Á lục địa và Đông Nam Á hải đảo.","B. Đông Nam Á phía Bắc và Đông Nam Á phía Nam.","C. Đông Nam Á ôn đới và Đông Nam Á nhiệt đới.","D. Đông Nam Á đồng bằng và Đông Nam Á cao nguyên."], ans:0},

  {id:25, q:"Khí hậu chủ đạo của khu vực Đông Nam Á lục địa là:", opts:["A. Khí hậu xích đạo quanh năm nóng ẩm.","B. Khí hậu nhiệt đới gió mùa.","C. Khí hậu cận nhiệt đới khô.","D. Khí hậu ôn đới hải dương."], ans:1},
  {id:26, q:"Cây lương thực truyền thống và quan trọng bậc nhất của khu vực Đông Nam Á là:", opts:["A. Lúa mì.","B. Ngô.","C. Lúa nước (lúa gạo).","D. Khoai tây."], ans:2},

  {id:28, q:"Hiệp hội các quốc gia Đông Nam Á (ASEAN) được thành lập vào năm nào tại Băng Cốc (Thái Lan)?", opts:["A. Năm 1965.","B. Năm 1967.","C. Năm 1975.","D. Năm 1995."], ans:1},
  {id:29, q:"Việt Nam chính thức gia nhập Hiệp hội các quốc gia Đông Nam Á (ASEAN) vào năm nào?", opts:["A. Năm 1986.","B. Năm 1992.","C. Năm 1995.","D. Năm 1999."], ans:2},
  {id:30, q:"Cộng đồng ASEAN (AC) được xây dựng dựa trên 3 trụ cột chính là:", opts:["A. Chính trị - An ninh, Kinh tế, Văn hóa - Xã hội.","B. Quân sự, Tài chính, Môi trường.","C. Nông nghiệp, Công nghiệp, Dịch vụ.","D. Thương mại, Đầu tư, Du lịch."], ans:0},
  {id:31, q:"Khu vực Tây Nam Á nằm ở vị trí ngã ba tiếp giáp giữa 3 châu lục nào?", opts:["A. Châu Á, Châu Âu, Châu Phi.","B. Châu Á, Châu Âu, Châu Mỹ.","C. Châu Á, Châu Phi, Châu Đại Dương.","D. Châu Âu, Châu Phi, Châu Mỹ."], ans:0},

  {id:33, q:"Khí hậu của phần lớn diện tích khu vực Tây Nam Á có đặc điểm là:", opts:["A. Nóng ẩm, mưa nhiều quanh năm.","B. Khô hạn, nóng khắc nghiệt, cảnh quan hoang mạc và bán hoang mạc chiếm ưu thế.","C. Lạnh giá quanh năm, băng tuyết bao phủ.","D. Ôn hòa, mát mẻ quanh năm."], ans:1},
  {id:34, q:"Phần lớn cư dân khu vực Tây Nam Á theo tôn giáo nào?", opts:["A. Phật giáo.","B. Ấn Độ giáo.","C. Hồi giáo (Islam).","D. Chính thống giáo."], ans:2},
  {id:35, q:"Khu vực tập trung trữ lượng dầu mỏ lớn nhất ở Tây Nam Á là:", opts:["A. Vùng ven Địa Trung Hải.","B. Vùng vịnh Péc-xích (Persian Gulf).","C. Vùng núi Cô-ca-dơ.","D. Vùng ven Biển Đen."], ans:1},
  {id:36, q:"Phần lãnh thổ trung tâm Bắc Mỹ của Hoa Kỳ tiếp giáp với hai quốc gia nào?", opts:["A. Ca-na-đa (phía Bắc) và Mê-hi-cô (phía Nam).","B. Cu-ba và Bra-xin.","C. Nga và Đan Mạch.","D. Mê-hi-cô và Cô-lôm-bi-a."], ans:0},
  {id:37, q:"Hai bang nằm tách biệt ngoài phần lãnh thổ trung tâm của Hoa Kỳ là:", opts:["A. California và Texas.","B. Alaska và Hawaii.","C. Florida và New York.","D. Washington và Nevada."], ans:1},
  {id:38, q:"Địa hình phần lãnh thổ trung tâm Hoa Kỳ được chia thành 3 khu vực rõ rệt từ Tây sang Đông là:", opts:["A. Hệ thống Coóc-đi-e phía Tây → Đồng bằng trung tâm ở giữa → Dãy A-pa-lát và đồng bằng ven Đại Tây Dương phía Đông.","B. Dãy A-pa-lát phía Tây → Cao nguyên ở giữa → Hệ thống Coóc-đi-e phía Đông.","C. Đồng bằng ở hai rìa và núi cao ở chính giữa.","D. Toàn bộ là bình nguyên thấp phẳng."], ans:0},
  {id:39, q:"Đặc điểm nổi bật về dân cư của Hoa Kỳ là:", opts:["A. Dân số giảm nhanh do không có người nhập cư.","B. Là quốc gia đa chủng tộc, đa văn hóa hình thành chủ yếu do quá trình nhập cư.","C. Dân cư phân bố đồng đều trên toàn lãnh thổ.","D. Tỉ lệ dân thành thị dưới 50%."], ans:1},
  {id:40, q:"Xu hướng chuyển dịch phân bố dân cư ở Hoa Kỳ trong những thập niên gần đây là:", opts:["A. Từ vùng Đông Bắc chuyển dịch về vùng phía Nam và ven bờ Thái Bình Dương (Vành đai Mặt Trời).","B. Từ ven biển chuyển sâu vào vùng hoang mạc nội địa.","C. Từ vùng phía Nam chuyển lên bang Alaska.","D. Từ thành thị quay trở lại vùng nông thôn làm nông nghiệp."], ans:0},
  {id:41, q:"Ngành kinh tế chiếm tỉ trọng lớn nhất trong cơ cấu GDP của Hoa Kỳ hiện nay là:", opts:["A. Nông - lâm - thủy sản.","B. Công nghiệp và xây dựng.","C. Dịch vụ (chiếm khoảng 80% GDP).","D. Khai thác khoáng sản."], ans:2},
  {id:42, q:"Hình thức tổ chức sản xuất nông nghiệp chủ yếu và hiệu quả cao ở Hoa Kỳ là:", opts:["A. Hộ gia đình tự cung tự cấp.","B. Trang trại (Farm) có quy mô diện tích lớn, áp dụng cơ giới hóa và công nghệ cao.","C. Hợp tác xã thủ công.","D. Du canh du cư."], ans:1},
  {id:43, q:"Các ngành công nghiệp hiện đại của Hoa Kỳ (hàng không vũ trụ, điện tử, tin học - Thung lũng Silicon) tập trung chủ yếu ở vùng nào?", opts:["A. Vùng Đông Bắc truyền thống.","B. Vùng phía Nam và ven Thái Bình Dương (Vành đai Mặt Trời).","C. Vùng núi đá Rocky.","D. Vùng bang Alaska."], ans:1},
  {id:44, q:"Quốc gia có diện tích lãnh thổ lớn nhất thế giới (hơn 17 triệu km²), nằm trải dài trên cả hai châu lục Á - Âu là:", opts:["A. Ca-na-đa.","B. Trung Quốc.","C. Liên bang Nga.","D. Hoa Kỳ."], ans:2},
  {id:45, q:"Dòng sông nào là ranh giới tự nhiên phân chia Liên bang Nga thành hai phần (phần phía Tây và phần phía Đông)?", opts:["A. Sông Vôn-ga (Volga).","B. Sông Ô-bi (Ob).","C. Sông I-ê-nít-xây (Yenisei).","D. Sông Lê-na (Lena)."], ans:2},
  {id:46, q:"Dãy núi nào được coi là ranh giới tự nhiên giữa hai châu lục Á - Âu trên lãnh thổ Liên bang Nga?", opts:["A. Dãy Cáp-ca.","B. Dãy U-ran (Ural).","C. Dãy An-tai.","D. Dãy Xai-an."], ans:1},
  {id:47, q:"Dòng sông được coi là biểu tượng của nước Nga, chảy trên đồng bằng Đông Âu và đổ vào biển Caspi là:", opts:["A. Sông Vôn-ga.","B. Sông Đôn.","C. Sông Ô-bi.","D. Sông A-mua."], ans:0},
  {id:48, q:"Hồ nước ngọt sâu nhất thế giới nằm ở phần phía Nam Xi-bia của Liên bang Nga là:", opts:["A. Hồ Victoria.","B. Hồ Thượng (Superior).","C. Hồ Bai-can (Baikal).","D. Hồ Ladoga."], ans:2},
  {id:49, q:"Kiểu rừng chiếm diện tích lớn nhất ở Liên bang Nga (đứng đầu thế giới về diện tích rừng) là:", opts:["A. Rừng nhiệt đới ẩm.","B. Rừng lá kim (rừng Tai-ga).","C. Rừng lá rộng thường xanh.","D. Rừng ngập mặn ven biển."], ans:1},
  {id:50, q:"Vấn đề dân số đáng lo ngại nhất của Liên bang Nga trong nhiều thập kỉ qua là:", opts:["A. Bùng nổ dân số quá nhanh.","B. Gia tăng tự nhiên âm hoặc rất thấp, dân số già hóa dẫn đến thiếu hụt lao động.","C. Mật độ dân số quá cao ở vùng Xi-bia.","D. Tỉ lệ biết chữ của người dân thấp."], ans:1},
  {id:51, q:"Đại bộ phận dân cư của Liên bang Nga (khoảng 70%) tập trung sinh sống ở khu vực nào?", opts:["A. Vùng Viễn Đông.","B. Vùng Bắc Cực.","C. Phần lãnh thổ thuộc châu Âu (đồng bằng Đông Âu).","D. Cao nguyên Trung Xi-bia."], ans:2},

            <br>• Các công ty xuyên quốc gia (TNCs) có vai trò ngày càng lớn, chi phối nhiều chuỗi cung ứng.
          </li>
          <li><b>2. Cơ hội đối với các nước đang phát triển:</b> Thu hút nguồn vốn đầu tư (FDI), tiếp nhận khoa học - công nghệ hiện đại và kinh nghiệm quản lí; mở rộng thị trường xuất khẩu hàng hóa; thúc đẩy chuyển dịch cơ cấu kinh tế và tạo việc làm.</li>
          <li><b>3. Thách thức đối với các nước đang phát triển:</b> Gia tăng khoảng cách giàu nghèo; áp lực cạnh tranh gay gắt cho doanh nghiệp nội địa; nguy cơ trở thành bãi thải công nghệ lạc hậu gây ô nhiễm môi trường; nguy cơ mai một bản sắc văn hóa dân tộc và phụ thuộc kinh tế.</li>
        </ul>`
    },
    {
      id: "geo_e2",
      title: "Câu 2 (Tự luận Địa lý 11): Điều kiện tự nhiên khu vực Đông Nam Á đối với phát triển kinh tế",
      prompt: "Phân tích những thuận lợi và khó khăn của vị trí địa lí và điều kiện tự nhiên khu vực Đông Nam Á đối với sự phát triển kinh tế - xã hội?",
      placeholder: "Nhập câu trả lời của bạn vào đây (gợi ý: vị trí cầu nối, khí hậu nhiệt đới gió mùa, đồng bằng phù sa, tài nguyên biển, khoáng sản và thiên tai bão lũ, động đất)...",
      keywords: ["cầu nối", "hàng hải", "nhiệt đới gió mùa", "lúa nước", "cây công nghiệp", "phù sa", "dầu mỏ", "kinh tế biển", "bão", "lũ lụt", "động đất", "núi lửa"],
      sampleHtml: `
        <b>Đáp án chuẩn chi tiết:</b>
        <ul>
          <li><b>1. Thuận lợi:</b>
            <br>• <i>Vị trí địa lí:</i> Nằm trên tuyến đường hàng hải quốc tế huyết mạch nối Thái Bình Dương và Ấn Độ Dương, cầu nối lục địa Á - Âu với Ô-xtrây-li-a → thuận lợi giao thương quốc tế.
            <br>• <i>Khí hậu & Đất đai:</i> Khí hậu nhiệt đới ẩm gió mùa và xích đạo nóng ẩm quanh năm kết hợp với đất phù sa màu mỡ ở các đồng bằng châu thổ (sông Mê Công, sông Hồng, sông Mê Nam) và đất đỏ bazan → phát triển nền nông nghiệp nhiệt đới (lúa nước, cao su, cà phê, hồ tiêu, cọ dầu).
            <br>• <i>Tài nguyên biển & Khoáng sản:</i> Vùng biển rộng lớn giàu hải sản, dầu khí, du lịch biển và cảng biển (trừ Lào); giàu khoáng sản như dầu mỏ, khí tự nhiên, thiếc, đồng, than đá.
          </li>
          <li><b>2. Khó khăn:</b>
            <br>• Nằm trong vành đai lửa Thái Bình Dương và vùng nhiệt đới gió mùa nên thường xuyên chịu thiên tai: bão nhiệt đới, lũ lụt, hạn hán, động đất, núi lửa và sóng thần.
            <br>• Địa hình bị chia cắt mạnh bởi các dãy núi và quần đảo gây trở ngại cho giao thông đường bộ liên vùng.
          </li>
        </ul>`
    }
  ]
};

// ==================== 4. LOGIC XỬ LÝ TRANG WEB ====================
let currentSubject = 'bio';
let currentList = [...BIO_QUESTIONS];
let userAnswers = {};
let mode = 'instant';
let submitted = false;

function switchSubject(sub) {
  currentSubject = sub;
  userAnswers = {};
  submitted = false;

  document.getElementById('btn-sub-bio').classList.toggle('active', sub === 'bio');
  document.getElementById('btn-sub-geo').classList.toggle('active', sub === 'geo');

  if (sub === 'bio') {
    currentList = [...BIO_QUESTIONS];
    document.getElementById('header-title').textContent = "🌸 Ôn Tập Sinh Học 11 (70 Câu Trắc Nghiệm & Tự Luận)";
  } else {
    currentList = [...GEO_QUESTIONS];
    document.getElementById('header-title').textContent = "🌸 Ôn Tập Địa Lý 11 (70 Câu Trắc Nghiệm & Tự Luận)";
  }

  renderAll();
  renderEssayArea();
}

function renderAll() {
  const nav = document.getElementById('nav-grid');
  const area = document.getElementById('quiz-area');
  nav.innerHTML = '';
  area.innerHTML = '';

  currentList.forEach((item) => {
    const dot = document.createElement('div');
    dot.className = 'q-dot';
    dot.id = `dot-${item.id}`;
    dot.textContent = item.id;
    dot.onclick = () => document.getElementById(`card-${item.id}`).scrollIntoView({behavior:'smooth', block:'center'});
    nav.appendChild(dot);

    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${item.id}`;

    let html = `<div class="q-title"><span class="q-num">Câu ${item.id}</span>${item.q}</div>`;

    if (item.table) {
      html += `<table class="sub-table"><thead><tr><th>Cột trái</th><th>Cột phải</th></tr></thead><tbody>`;
      item.table.forEach(r => { html += `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`; });
      html += `</tbody></table>`;
    }

    if (item.type === 'tf') {
      html += `<table class="sub-table"><thead><tr><th>Mệnh đề</th><th style="width:90px">Đúng</th><th style="width:90px">Sai</th></tr></thead><tbody>`;
      item.items.forEach((sub, sIdx) => {
        html += `<tr>
          <td>${sub.text}</td>
          <td style="text-align:center"><button class="tf-btn" id="tf-${item.id}-${sIdx}-true" onclick="selectTF(${item.id}, ${sIdx}, true)">Đúng</button></td>
          <td style="text-align:center"><button class="tf-btn" id="tf-${item.id}-${sIdx}-false" onclick="selectTF(${item.id}, ${sIdx}, false)">Sai</button></td>
        </tr>`;
      });
      html += `</tbody></table>`;
    } else {
      html += `<div class="options">`;
      item.opts.forEach((opt, oIdx) => {
        html += `<button class="opt-btn" id="opt-${item.id}-${oIdx}" onclick="selectOpt(${item.id}, ${oIdx})">${opt}</button>`;
      });
      html += `</div>`;
    }

    html += `<div class="explain" id="exp-${item.id}"></div>`;
    card.innerHTML = html;
    area.appendChild(card);
  });

  updateUI();
}

function renderEssayArea() {
  const container = document.getElementById('essay-area');
  const list = ESSAY_DATA[currentSubject];
  container.innerHTML = '';

  list.forEach((item) => {
    const savedText = localStorage.getItem(`essay_${item.id}`) || '';
    const card = document.createElement('div');
    card.className = 'essay-card';
    card.innerHTML = `
      <div class="essay-header">🌸 ${item.title}</div>
      <div class="essay-prompt"><b>Đề bài:</b> ${item.prompt}</div>
      <textarea class="essay-textarea" id="input-${item.id}" placeholder="${item.placeholder}" oninput="saveEssayDraft('${item.id}')">${savedText}</textarea>
      <div class="essay-actions">
        <button class="btn btn-primary" onclick="checkEssay('${item.id}')">✨ Chấm theo ý chính (Từ khóa)</button>
        <button class="btn btn-outline" onclick="toggleSample('${item.id}')">📖 Ẩn / Hiện đáp án mẫu</button>
        <button class="btn btn-danger" onclick="clearEssay('${item.id}')">🗑️ Xóa bài viết</button>
      </div>
      <div class="essay-feedback" id="fb-${item.id}"></div>
      <div class="essay-sample" id="sp-${item.id}">${item.sampleHtml}</div>
    `;
    container.appendChild(card);
  });
}

function saveEssayDraft(eId) {
  const val = document.getElementById(`input-${eId}`).value;
  localStorage.setItem(`essay_${eId}`, val);
}

function clearEssay(eId) {
  document.getElementById(`input-${eId}`).value = '';
  localStorage.removeItem(`essay_${eId}`);
  document.getElementById(`fb-${eId}`).className = 'essay-feedback';
}

function toggleSample(eId) {
  const sp = document.getElementById(`sp-${eId}`);
  sp.classList.toggle('show');
}

function checkEssay(eId) {
  const list = ESSAY_DATA[currentSubject];
  const item = list.find(x => x.id === eId);
  const text = (document.getElementById(`input-${eId}`).value || '').toLowerCase();
  const fb = document.getElementById(`fb-${eId}`);

  if (!text.trim()) {
    fb.className = 'essay-feedback show';
    fb.innerHTML = '⚠️ Bạn hãy gõ câu trả lời vào ô trống phía trên trước khi bấm chấm điểm nhé!';
    return;
  }

  let matched = [];
  let missed = [];
  item.keywords.forEach(kw => {
    if (text.includes(kw.toLowerCase())) matched.push(kw);
    else missed.push(kw);
  });

  const ratio = Math.round((matched.length / item.keywords.length) * 100);
  let html = `<div><b>Kết quả dò ý chính:</b> Đạt <b>${matched.length}/${item.keywords.length}</b> từ khóa trọng tâm (<b>${ratio}%</b>).</div>`;
  if (matched.length > 0) {
    html += `<div style="margin-top:6px;">✅ <b>Ý đã nêu được:</b> ` + matched.map(k => `<span class="kw-tag kw-ok">${k}</span>`).join('') + `</div>`;
  }
  if (missed.length > 0) {
    html += `<div style="margin-top:6px;">💡 <b>Từ khóa nên bổ sung thêm:</b> ` + missed.map(k => `<span class="kw-tag kw-miss">${k}</span>`).join('') + `</div>`;
  }
  fb.className = 'essay-feedback show';
  fb.innerHTML = html;
}

function selectOpt(qId, oIdx) {
  if (mode === 'exam' && submitted) return;
  userAnswers[qId] = oIdx;
  updateUI();
}

function selectTF(qId, sIdx, val) {
  if (mode === 'exam' && submitted) return;
  if (!userAnswers[qId]) userAnswers[qId] = {};
  userAnswers[qId][sIdx] = val;
  updateUI();
}

function isQuestionCorrect(item) {
  const ua = userAnswers[item.id];
  if (ua === undefined) return null;
  if (item.type === 'tf') {
    if (Object.keys(ua).length < item.items.length) return 'partial';
    return item.items.every((sub, idx) => ua[idx] === sub.ans);
  }
  return ua === item.ans;
}

function updateUI() {
  let doneCount = 0;
  let correctCount = 0;
  const showResult = (mode === 'instant') || (mode === 'exam' && submitted);

  currentList.forEach(item => {
    const ua = userAnswers[item.id];
    const dot = document.getElementById(`dot-${item.id}`);
    const exp = document.getElementById(`exp-${item.id}`);
    const status = isQuestionCorrect(item);

    if (status !== null && status !== 'partial') {
      doneCount++;
      if (status === true) correctCount++;
    }

    if (dot) {
      dot.className = 'q-dot';
      if (status !== null && status !== 'partial') {
        if (showResult) {
          dot.classList.add(status ? 'done-ok' : 'done-err');
        } else {
          dot.classList.add('done-wait');
        }
      }
    }

    if (item.type === 'tf') {
      item.items.forEach((sub, sIdx) => {
        const btnT = document.getElementById(`tf-${item.id}-${sIdx}-true`);
        const btnF = document.getElementById(`tf-${item.id}-${sIdx}-false`);
        if (!btnT || !btnF) return;
        btnT.className = 'tf-btn';
        btnF.className = 'tf-btn';
        const picked = ua ? ua[sIdx] : undefined;
        if (picked !== undefined) {
          const targetBtn = picked ? btnT : btnF;
          if (showResult) {
            targetBtn.classList.add(picked === sub.ans ? 'correct' : 'wrong');
          } else {
            targetBtn.classList.add('active');
          }
        }
      });
      if (showResult && status !== null && status !== 'partial') {
        exp.className = 'explain show';
        exp.innerHTML = `<b>🌸 Đáp án chuẩn:</b> 1-Đúng, 2-Đúng, 3-Sai, 4-Đúng. ${item.note || ''}`;
      } else {
        exp.className = 'explain';
      }
    } else {
      item.opts.forEach((_, oIdx) => {
        const btn = document.getElementById(`opt-${item.id}-${oIdx}`);
        if (!btn) return;
        btn.className = 'opt-btn';
        if (ua !== undefined) {
          if (showResult) {
            if (oIdx === item.ans) btn.classList.add('correct');
            else if (oIdx === ua && ua !== item.ans) btn.classList.add('wrong');
          } else if (oIdx === ua) {
            btn.classList.add('selected');
          }
        }
      });
      if (showResult && ua !== undefined) {
        exp.className = 'explain show';
        const letter = ['A','B','C','D'][item.ans];
        exp.innerHTML = `<b>🌸 Đáp án đúng: ${letter}</b>${item.note ? ' — ' + item.note : ''}`;
      } else {
        exp.className = 'explain';
      }
    }
  });

  document.getElementById('stat-done').textContent = `Đã làm: ${doneCount}/${currentList.length}`;
  document.getElementById('stat-correct').textContent = showResult ? `Đúng: ${correctCount}/${currentList.length}` : `Đúng: --`;
  const score = currentList.length ? ((correctCount / currentList.length) * 10).toFixed(2) : '0.00';
  document.getElementById('stat-score').textContent = showResult ? `Điểm: ${score}` : `Điểm: --`;
}

function setMode(m) {
  mode = m;
  submitted = false;
  document.getElementById('mode-instant').classList.toggle('active', m === 'instant');
  document.getElementById('mode-exam').classList.toggle('active', m === 'exam');
  document.getElementById('btn-submit').style.display = (m === 'exam') ? 'inline-block' : 'none';

  // Nếu đang ở tab tự luận thì chuyển về tab trắc nghiệm
  document.getElementById('essay-area').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('nav-grid').style.display = 'grid';
  document.getElementById('tab-essay').classList.remove('active');
  updateUI();
}

function submitExam() {
  submitted = true;
  updateUI();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function shuffleQuestions() {
  currentList = [...currentList].sort(() => Math.random() - 0.5);
  renderAll();
}

function filterWrong() {
  const wrongList = currentList.filter(item => isQuestionCorrect(item) === false);
  if (wrongList.length === 0) {
    alert('Bạn chưa có câu trả lời sai nào (hoặc chưa làm bài)!');
    return;
  }
  currentList = wrongList;
  wrongList.forEach(item => delete userAnswers[item.id]);
  submitted = false;
  renderAll();
}

function resetQuiz() {
  userAnswers = {};
  submitted = false;
  currentList = (currentSubject === 'bio') ? [...BIO_QUESTIONS] : [...GEO_QUESTIONS];
  renderAll();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function toggleEssay() {
  const essay = document.getElementById('essay-area');
  const quiz = document.getElementById('quiz-area');
  const grid = document.getElementById('nav-grid');
  const btn = document.getElementById('tab-essay');
  const showingEssay = essay.style.display === 'block';

  essay.style.display = showingEssay ? 'none' : 'block';
  quiz.style.display = showingEssay ? 'block' : 'none';
  grid.style.display = showingEssay ? 'grid' : 'none';
  btn.classList.toggle('active', !showingEssay);
}

renderAll();
renderEssayArea();
</script>
